<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <link rel="stylesheet" href="todo-task.css">
    <script src="todotask.js" defer></script>
</head>

<body>

    <main class="todo-container">
        <h1>My To-Do List</h1>
        <p class="subtitle">Plan your day, one task at a time.</p>

        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="What do you need to do?" autocomplete="off" required>

            <button type="submit">Add Task</button>
        </form>

        <p id="task-count">0 tasks remaining</p>

        <ul id="todo-list"></ul>
    </main>

</body>

</html>
